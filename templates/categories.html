<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zambre Agencies | Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body class="bg-light">
    <div class="page-container">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h2>Product Categories</h2>
                <p>View all product categories and their inventory count.</p>
            </div>

            <div class="header-actions">
                <a href="{{ url_for('admin_dashboard') }}" class="btn-dashboard"> ← Dashboard </a>

                <a href="{{ url_for('add_product_page') }}" class="btn-add"> + Add Product </a>
            </div>
        </div>

        <!-- Categories -->
        <div class="row g-4">

            {% for category in categories %}
            <div class="col-xl-4 col-md-6">

                <div class="category-card">
                    <div class="category-icon">▦</div>

                    <h5>{{ category }}</h5>

                    <p>
                        Products:<strong>{{ category_counts[category] }}</strong>
                    </p>

                    <a href="{{ url_for('category_products', category=category) }}" class="category-link"> View Category Products →</a>
                </div>

            </div>
            {% endfor %}

        </div>

        <!-- Footer -->
        <footer>
            © 2026 Zambre Agencies | Quality Products • Trusted Service
        </footer>

    </div>
</body>
</html>
