<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zambre Agencies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--CSS FILE-->
    <link rel="stylesheet" href=" {{ url_for('static', filename='css/common.css')}}">
    <link rel="stylesheet" href="{{ url_for('static' , filename='css/responsive.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css')}}">
</head>

<body class="auth-page">
    {% include 'nav.html' %}

    <div class="auth-card">

        <!-- Brand -->
        <div class="text-center mb-4">

            <h2>🌿 Zambre Agencies</h2>

            <p class="auth-subtitle"> Welcome Back! Please Login </p>

        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="alert alert-info alert-dismissible fade show" role="alert">

                    {{ message }}

                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

                </div>
            {% endfor %}
        {% endwith %}

        <!-- Login Form -->
        <form action="{{ url_for('logincheck') }}" method="POST">

            <div class="mb-3">

                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" autocomplete="email" required>

            </div>

            <div class="mb-4">

                <label for="password" class="form-label"> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>

            </div>

            <button type="submit" class="auth-submit-btn"> Login </button>

        </form>

        <!-- Register Link -->
        <p class="auth-footer"> Don't have an account?<a href="{{ url_for('register') }}">Register Here</a></p>

        <!-- Home Link -->
        <a href="{{ url_for('home') }}" class="auth-home-link"> ← Back to Home </a>

    </div>

    <script src="{{ url_for('static', filename='js/user.js')}}"></script>
    <script src="{{ url_for('static', filename='js/common.js')}}"></script>
    <script src="{{ url_for('static', filename='js/admin.js')}}"></script>

</body>
</html>
